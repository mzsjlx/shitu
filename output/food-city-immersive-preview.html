&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {

      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();

  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      modelContent: null,
      privateContent: null,
      ...parsedState,
    };

    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

#food-city-immersive *,#food-city-immersive *::before,#food-city-immersive *::after { box-sizing:border-box; }
#food-city-immersive button,#food-city-immersive select { font:inherit; color:inherit; }
#food-city-immersive button { -webkit-tap-highlight-color:transparent; }
#food-city-immersive button:disabled { cursor:default; }
#food-city-immersive .fc-app { background:var(--fc-paper); border-radius:8px; overflow:hidden; }
#food-city-immersive .fc-top { display:flex; align-items:center; gap:20px; min-height:64px; padding:10px 110px 10px 28px; background:var(--fc-paper); }
#food-city-immersive .fc-brand { font:600 25px/1.2 &quot;Noto Serif SC&quot;,&quot;Songti SC&quot;,SimSun,serif; letter-spacing:1px; white-space:nowrap; }
#food-city-immersive .fc-city { padding:8px 20px; background:var(--fc-soft); border-radius:30px; white-space:nowrap; }
#food-city-immersive .fc-separator { width:1px; height:19px; background:var(--fc-line); }
#food-city-immersive .fc-pill { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:9px 16px; border:0; border-radius:30px; background:var(--fc-soft); min-height:40px; }
#food-city-immersive .fc-my-route { margin-left:auto; white-space:nowrap; }
#food-city-immersive .fc-stage { height:620px; position:relative; isolation:isolate; background:#a4b9ac; }
#food-city-immersive .fc-city-image { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; pointer-events:none; }
#food-city-immersive .fc-route-art { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
#food-city-immersive .fc-pin { position:absolute; width:0; height:0; z-index:3; }
#food-city-immersive .fc-pin[data-active=true] { z-index:5; }
#food-city-immersive .fc-marker { position:absolute; display:grid; place-items:center; width:33px; height:33px; padding:0; border:2px solid var(--fc-paper); background:var(--fc-orange); color:#fff9f2; box-shadow:0 3px 9px #75422e45; border-radius:50%; transform:translate(-50%,-50%); font-size:16px; }
#food-city-immersive .fc-card { position:absolute; bottom:24px; left:var(--fc-card-nudge,0px); width:170px; transform:translateX(-50%); padding:6px; background:var(--fc-paper); border-radius:var(--fc-radius); box-shadow:0 10px 24px var(--fc-shadow); }
#food-city-immersive .fc-card::after { content:&quot;&quot;; position:absolute; bottom:-10px; left:calc(50% - 9px - var(--fc-card-nudge,0px)); width:18px; height:18px; background:var(--fc-paper); border-radius:0 0 5px 0; transform:rotate(45deg); }
#food-city-immersive .fc-card[data-below=true] { top:24px; bottom:auto; }
#food-city-immersive .fc-card[data-below=true]::after { top:-9px; bottom:auto; transform:rotate(225deg); }
#food-city-immersive .fc-card[data-occluded=true] { visibility:hidden; pointer-events:none; }
#food-city-immersive .fc-pin[data-active=true] .fc-card { width:300px; }
#food-city-immersive .fc-photo-button { display:block; position:relative; padding:0; border:0; border-radius:calc(var(--fc-radius) - 6px); width:100%; background:none; overflow:hidden; }
#food-city-immersive .fc-food-photo { display:block; height:102px; background-image:var(--fc-foods); background-size:300% auto; background-position:var(--food-x) center; }
#food-city-immersive .fc-pin[data-active=true] .fc-food-photo { height:154px; }
#food-city-immersive .fc-photo-play { position:absolute; right:8px; bottom:8px; width:27px; height:27px; display:grid; place-items:center; border-radius:50%; background:var(--fc-paper); color:var(--fc-ink); }
#food-city-immersive .fc-food-title { width:100%; text-align:left; border:0; background:none; padding:7px 7px 5px; font:600 18px/1.4 &quot;Noto Serif SC&quot;,&quot;Songti SC&quot;,SimSun,serif; }
#food-city-immersive .fc-pin[data-active=true] .fc-food-title { font-size:21px; padding:8px 9px 1px; }
#food-city-immersive .fc-food-sub { color:var(--fc-muted); font-size:11px; padding:0 9px 9px; }
#food-city-immersive .fc-card-actions { display:flex; gap:7px; padding:0 4px 5px; }
#food-city-immersive .fc-action { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:40px; padding:9px 13px; border:1px solid var(--fc-line); border-radius:15px; background:var(--fc-paper); color:var(--fc-ink); box-shadow:0 2px 5px #47352b0c; text-decoration:none; transition:transform 260ms cubic-bezier(.2,1.2,.35,1); }
#food-city-immersive .fc-action:active,#food-city-immersive .fc-pill:active { transform:scale(.97); }
#food-city-immersive .fc-primary { background:var(--fc-orange); border-color:var(--fc-orange); color:#fff9f2; }
#food-city-immersive .fc-added { background:#f7e7db; border-color:#f7e7db; color:#8a4c35; }
#food-city-immersive .fc-card-actions .fc-action { flex:1; padding-left:8px; padding-right:8px; font-size:12px; }
#food-city-immersive .fc-dock { position:absolute; z-index:9; left:50%; bottom:25px; transform:translateX(-50%); display:flex; align-items:center; gap:19px; padding:14px 18px 14px 24px; max-width:calc(100% - 40px); min-height:70px; border-radius:27px; background:var(--fc-paper); box-shadow:0 12px 35px #38281d28; white-space:nowrap; }
#food-city-immersive .fc-dock-title { display:flex; align-items:center; gap:5px; border:0; padding:0; background:none; font:600 18px/1.4 &quot;Noto Serif SC&quot;,&quot;Songti SC&quot;,SimSun,serif; }
#food-city-immersive .fc-dock-stops { display:flex; gap:12px; align-items:center; }

&lt;script&gt;
(() =&gt; {
  const root=document.getElementById(&#x27;food-city-immersive&#x27;); if(!root)return;

  const shops={noodle:{name:&#x27;巷口小面&#x27;,short:&#x27;小面&#x27;,dish:&#x27;一碗热面，开启逛吃&#x27;,photo:0},hotpot:{name:&#x27;山城老火锅&#x27;,short:&#x27;火锅&#x27;,dish:&#x27;热辣锅底 · 山城风味&#x27;,photo:50},ice:{name:&#x27;街角冰粉&#x27;,short:&#x27;冰粉&#x27;,dish:&#x27;清甜收尾，慢慢逛&#x27;,photo:100}};
  const ids=Object.keys(shops),tastes=[&#x27;咸香&#x27;,&#x27;甜口&#x27;,&#x27;酸爽&#x27;,&#x27;鲜味&#x27;],spices=[&#x27;不辣&#x27;,&#x27;微辣&#x27;,&#x27;中辣&#x27;,&#x27;很辣&#x27;],durations=[&#x27;2 小时&#x27;,&#x27;半天&#x27;,&#x27;一天&#x27;];
  const design={radius:23};
  let state={route:[&#x27;noodle&#x27;,&#x27;hotpot&#x27;],selected:&#x27;hotpot&#x27;,panel:&#x27;none&#x27;,tastes:[&#x27;咸香&#x27;,&#x27;甜口&#x27;],spice:&#x27;微辣&#x27;,duration:&#x27;半天&#x27;,start:&#x27;解放碑附近&#x27;};
  let undo=null,toastTimer=null;
  function restore(raw){const m=raw&amp;&amp;raw.modelContent,p=raw&amp;&amp;raw.privateContent;if(m&amp;&amp;m.kind===&#x27;food-city-immersive-v2&#x27;){state.route=Array.isArray(m.routeIds)?[...new Set(m.routeIds.filter(id=&gt;ids.includes(id)))]:state.route;state.tastes=Array.isArray(m.tastes)?m.tastes.filter(t=&gt;tastes.includes(t)):state.tastes;state.spice=spices.includes(m.spice)?m.spice:state.spice;state.duration=durations.includes(m.duration)?m.duration:state.duration;state.start=[&#x27;解放碑附近&#x27;,&#x27;临江门附近&#x27;,&#x27;第一家门店&#x27;].includes(m.start)?m.start:state.start;}if(p){state.selected=ids.includes(p.selected)?p.selected:null;state.panel=[&#x27;none&#x27;,&#x27;planner&#x27;,&#x27;route&#x27;,&#x27;video&#x27;].includes(p.panel)?p.panel:&#x27;none&#x27;;}if(state.panel===&#x27;video&#x27;&amp;&amp;!state.selected)state.panel=&#x27;none&#x27;;}

  function persist(){if(window.openai&amp;&amp;window.openai.setWidgetState)Promise.resolve(window.openai.setWidgetState({modelContent:{kind:&#x27;food-city-immersive-v2&#x27;,routeIds:state.route,routeNames:state.route.map(id=&gt;shops[id].name),tastes:state.tastes,spice:state.spice,duration:state.duration,start:state.start,conceptOnly:true},privateContent:{selected:state.selected,panel:state.panel}})).catch(()=&gt;{});}
  function icon(name){return `&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;}
  function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
  function announce(text,canUndo=false){clearTimeout(toastTimer);const area=root.querySelector(&#x27;[data-toast]&#x27;);area.textContent=text;if(canUndo){const b=document.createElement(&#x27;button&#x27;);b.type=&#x27;button&#x27;;b.dataset.undo=&#x27;true&#x27;;b.className=&#x27;cursor-interaction&#x27;;b.textContent=&#x27;撤销&#x27;;area.appendChild(b);}toastTimer=setTimeout(()=&gt;{area.replaceChildren();undo=null;},5500);}
  function positions(){const w=stage.clientWidth;if(w&lt;=600)return {noodle:[22,76],hotpot:[53,59],ice:[77,22]};if(w&lt;=700)return {noodle:[20,75],hotpot:[56,72],ice:[86,31]};if(w&lt;=800)return {noodle:[20,75],hotpot:[56,62],ice:[88,31]};return {noodle:[20,75],hotpot:[60,60],ice:[85,34]};}
  function renderPins(){const pos=positions();root.querySelector(&#x27;[data-pins]&#x27;).innerHTML=ids.map(id=&gt;{const s=shops[id],active=state.selected===id&amp;&amp;state.panel===&#x27;none&#x27;,n=state.route.indexOf(id),added=n&gt;=0;return `&lt;div class=&quot;fc-pin&quot; style=&quot;left:${pos[id][0]}%;top:${pos[id][1]}%;--food-x:${s.photo}%&quot; data-pin=&quot;${id}&quot; data-active=&quot;${active}&quot; data-in-route=&quot;${added}&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;fc-marker cursor-interaction&quot; data-shop=&quot;${id}&quot; aria-label=&quot;选择${s.name}&quot;&gt;${added?n+1:&#x27;·&#x27;}&lt;/button&gt;&lt;article class=&quot;fc-card&quot; aria-label=&quot;${s.name}&quot;&gt;${active?`&lt;button type=&quot;button&quot; class=&quot;fc-close fc-card-close cursor-interaction&quot; data-collapse=&quot;${id}&quot; aria-label=&quot;收起${s.name}&quot;&gt;${icon(&#x27;x&#x27;)}&lt;/button&gt;`:&#x27;&#x27;}&lt;button type=&quot;button&quot; class=&quot;fc-photo-button cursor-interaction&quot; data-shop=&quot;${id}&quot; aria-label=&quot;展开${s.name}&quot;&gt;&lt;span class=&quot;fc-food-photo&quot; role=&quot;img&quot; aria-label=&quot;${s.name}菜品概念图&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fc-photo-play&quot;&gt;${icon(&#x27;play&#x27;)}&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;fc-food-title cursor-interaction&quot; data-shop=&quot;${id}&quot;&gt;${s.name}&lt;/button&gt;${active?`&lt;p class=&quot;fc-food-sub&quot;&gt;${s.dish}&lt;/p&gt;&lt;div class=&quot;fc-card-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;fc-action cursor-interaction&quot; data-video=&quot;${id}&quot;&gt;${icon(&#x27;play&#x27;)}播放视频&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;fc-action ${added?&#x27;fc-added&#x27;:&#x27;fc-primary&#x27;} cursor-interaction&quot; data-add=&quot;${id}&quot; ${added?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;${icon(added?&#x27;check&#x27;:&#x27;plus&#x27;)}${added?&#x27;已   function head(title,sub=&#x27;&#x27;){return `&lt;div class=&quot;fc-pop-head&quot;&gt;&lt;div&gt;&lt;h2&gt;${title}&lt;/h2&gt;${sub?`&lt;p class=&quot;fc-muted&quot;&gt;${sub}&lt;/p&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;fc-close cursor-interaction&quot; data-close aria-label=&quot;关闭浮层&quot;&gt;${icon(&#x27;x&#x27;)}&lt;/button&gt;&lt;/div&gt;`;}
